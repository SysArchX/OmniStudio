name: Build de instaladores

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact: release/OmniStudio-Setup.exe
            out: OmniStudio-Setup.exe
            command: npx electron-builder --win nsis --publish never
          - os: ubuntu-latest
            name: Debian
            artifact: release/OmniStudio.deb
            out: OmniStudio.deb
            command: npx electron-builder --linux deb --publish never
          - os: ubuntu-latest
            name: Arch
            artifact: release/OmniStudio.pacman
            out: OmniStudio.pacman
            command: npx electron-builder --linux pacman --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Empacotar
        run: ${{ matrix.command }}

      - name: Renomear artefato
        shell: bash
        run: cp "${{ matrix.artifact }}" "${{ matrix.out }}"

      - uses: actions/upload-artifact@v4
        with:
          name: omni-${{ matrix.name }}
          path: ${{ matrix.out }}

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Adicionar plataforma Android
        run: npx cap add android || npx cap sync android

      - name: Configurar keystore para build de release
        run: |
          echo "keystore.storeFile=${{ secrets.ANDROID_KEYSTORE_FILE }}" >> android/local.properties
          echo "keystore.storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/local.properties
          echo "keystore.keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/local.properties
          echo "keystore.keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/local.properties

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Preparar arquivo
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "${{ github.run_number }}.apk"
          ls -lh "${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: omni-Android
          path: "${{ github.run_number }}.apk"

  release:
    name: Publicar release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Listar arquivos
        run: ls -la artifacts

      - name: Criar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: OmniStudio ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/OmniStudio-Setup.exe
            artifacts/OmniStudio.deb
            artifacts/OmniStudio.pacman
            artifacts/OmniStudio.apk
            packaging/arch/PKGBUILD