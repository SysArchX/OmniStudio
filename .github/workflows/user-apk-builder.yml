name: APK do usuário

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nome do app"
        required: true
        type: string
      app_slug:
        description: "Slug usado no APK e no package id"
        required: true
        type: string
      app_kind:
        description: "Tipo gerado (game, quiz, timer, notes, tasks, ia)"
        required: false
        default: custom
        type: string
      app_html:
        description: "HTML completo do app em base64 (limite de 60 KB)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Empacotar e compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Extrair o HTML enviado
        run: |
          mkdir -p /tmp/app/www
          echo "${{ inputs.app_html }}" | base64 -d > /tmp/app/www/index.html
          ls -lh /tmp/app/www/index.html

      - name: Criar projeto Capacitor
        working-directory: /tmp/app
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "${{ inputs.app_name }}" "com.sysarchx.${{ inputs.app_slug }}" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Compilar APK debug
        working-directory: /tmp/app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar arquivo
        run: |
          cp /tmp/app/android/app/build/outputs/apk/debug/app-debug.apk "${{ inputs.app_slug }}.apk"
          ls -lh "${{ inputs.app_slug }}.apk"

      - name: Publicar release com o APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "app-${{ inputs.app_slug }}-${{ github.run_number }}" \
            "${{ inputs.app_slug }}.apk" \
            --title "${{ inputs.app_name }}" \
            --notes "APK gerado pela fábrica de APKs do OmniStudio AI. Tipo: ${{ inputs.app_kind }}."
